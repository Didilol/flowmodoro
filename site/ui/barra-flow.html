/* Fonts bundled locally so the app looks the same offline. */






/* Shared tokens for both windows. Windows are transparent: only the bar and the card paint. */
:root {
  --surface: #ffffff;
  --field: #edf1f0;
  --ink: #18201f;
  --muted: #5b6967;
  --line: #d2dad8;
  --accent: #2b776f;
  --on-accent: #ffffff;
  --shade: rgb(24 32 31 / 0.28);
  --page: #f3f6f5;
  --hover: color-mix(in srgb, var(--accent) 9%, transparent);
  --press: color-mix(in srgb, var(--accent) 18%, transparent);
  --bar-bg: #1c2524;
  --bar-fg: #eef3f1;
  --bar-muted: #9aaaa7;
  --bar-line: #33403e;
  --bar-btn: #2a3533;
  --bar-btn-hover: #364442;
  --bar-accent: #5dbab0;
  --bar-flow: #e3b24c;
  --f-display: "Bricolage Grotesque Variable", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #19211f;
    --field: #101615;
    --ink: #e3eae8;
    --muted: #93a29f;
    --line: #2b3634;
    --accent: #5dbab0;
    --on-accent: #101615;
    --shade: rgb(0 0 0 / 0.45);
    --page: #0f1514;
    --bar-bg: #26312f;
    --bar-line: #3a4846;
    --bar-btn: #33403e;
    --bar-btn-hover: #405049;
    --bar-accent: #6fcbc0;
    --bar-flow: #e8ba58;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5; color: var(--ink); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- floating bar ---------- */
.bar-body { display: flex; align-items: flex-end; user-select: none; -webkit-user-select: none; cursor: default; }
.bar-wrap { position: relative; width: 100%; }
.bar {
  position: relative; z-index: 1;
  width: 100%;
  background: var(--bar-bg); color: var(--bar-fg);
  border-radius: 14px; overflow: hidden;
  border: 1px solid var(--bar-line);
}
.bar-main { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 16px; }
.bar-step { position: relative; flex: 1; min-width: 0; display: grid; gap: 1px; }
.bar-hint {
  position: absolute; inset: -4px 0; display: flex; align-items: center; gap: 8px;
  background: var(--bar-bg); color: var(--bar-fg); pointer-events: none;
  opacity: 0; transform: translateY(3px); transition: opacity 0.14s, transform 0.14s;
}
.bar-hint.on { opacity: 1; transform: none; }
.bar-hint b { font-family: var(--f-display); font-weight: 500; font-size: 15px; }
.bar-hint .key { color: var(--bar-muted); }
.bar-step.swap { animation: swap 0.35s ease-out; }
.kind { font-size: 10.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--bar-accent); }
.step-text {
  font-family: var(--f-display); font-weight: 500; font-size: 16.5px; line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.step-sub { font-family: var(--f-mono); font-size: 12px; color: var(--bar-muted); font-variant-numeric: tabular-nums; }
.bar-time { font-family: var(--f-mono); font-size: 14px; color: var(--bar-muted); font-variant-numeric: tabular-nums; transition: color 0.6s; }
.bar.flow .bar-time { color: var(--bar-flow); }
.bar.nudge { animation: nudge 0.6s ease-in-out; }
.ibtn {
  width: 34px; height: 34px; flex: none; border: 0; border-radius: 10px;
  background: var(--bar-btn); color: var(--bar-fg); display: grid; place-items: center;
  transition: background-color 0.15s, color 0.15s, transform 0.12s ease-out, box-shadow 0.15s;
}
.ibtn:hover, .ibtn.hover { background: var(--bar-btn-hover); transform: translateY(-1px); box-shadow: 0 0 0 1px var(--bar-line); }
:is(.ibtn:hover, .ibtn.hover):is(#doneBtn, #plusBtn, #fullBtn, #pauseBtn) { color: var(--bar-accent); }
:is(.ibtn:hover, .ibtn.hover)#lostBtn { color: var(--bar-flow); }
.ibtn:active, .ibtn.pressed { transform: scale(0.9); transition-duration: 0.06s; }
.ibtn svg { width: 18px; height: 18px; }
/* ✓ / +: confirm with a flash and the check drawing itself again. */
.ibtn.ok { animation: ok 0.5s ease-out; }
.ibtn.ok path { stroke-dasharray: 24; animation: draw 0.4s ease-out; }
/* ⚑ / waves: a quick pulse while the box opens. */
.ibtn.pop { animation: pop 0.35s ease-out; }
.track { height: 3px; background: var(--bar-line); }
.fill { height: 100%; width: 0; background: var(--bar-accent); transition: background 0.6s; }
.bar.flow .fill { background: var(--bar-flow); }

/* paused: the clock goes grey and ▶ lights up, so it's clear what to press */
.i-play, .paused .i-pause { display: none; }
.paused .i-play { display: block; }
.paused #pauseBtn:not(.hover):not(:hover) { background: var(--bar-accent); color: var(--bar-bg); }
.paused :is(.bar-time, .bar.flow .bar-time) { color: var(--bar-muted); }
.paused :is(.fill, .bar.flow .fill) { background: var(--bar-muted); }

/* ---------- minimal timer ----------
   Just the circle in the corner. Hovering it slides the bar in beside it,
   without its own clock and track (the circle already shows both). */
.dial-wrap { position: relative; flex: none; transform-origin: 100% 100%; transition: transform 0.35s cubic-bezier(0.3, 1.3, 0.5, 1); }
.dial {
  position: relative; z-index: 1;
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--bar-bg); border: 1px solid var(--bar-line);
  display: grid; place-content: center; justify-items: center; gap: 3px;
}
.dial svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
.dial circle { fill: none; stroke-width: 3; }
.dial-track { stroke: var(--bar-line); transition: stroke 0.3s; }
.dial-fill {
  stroke: var(--bar-accent); stroke-linecap: round;
  stroke-dasharray: 100; stroke-dashoffset: 100;
  transition: stroke-dashoffset 1s linear, stroke 0.6s, opacity 0.2s;
}
.dial.flow .dial-fill { stroke: var(--bar-flow); }
.dial-time {
  font-family: var(--f-mono); font-size: 13px; font-weight: 500; color: var(--bar-fg);
  font-variant-numeric: tabular-nums; pointer-events: none; transition: color 0.6s, opacity 0.2s;
}
.dial-time.long { font-size: 10.5px; }
.dial.flow .dial-time { color: var(--bar-flow); }
.dial.nudge { animation: nudge 0.6s ease-in-out; }
.dial-paused { display: none; width: 8px; height: 9px; border-inline: 2.5px solid var(--bar-muted); }
.paused .dial-paused { display: block; }
.paused :is(.dial-time, .dial.flow .dial-time) { color: var(--bar-muted); }
.paused :is(.dial-fill, .dial.flow .dial-fill) { stroke: var(--bar-muted); }
/* minimized: a dot with the mascot (if on) shrunk along; no numbers, no progress */
.dial-wrap.min { transform: scale(0.5); }
.dial-wrap.min :is(.dial-time, .dial-fill) { opacity: 0; }
/* the outline keeps the dot findable on a dark desktop */
.dial-wrap.min .dial-track { stroke: var(--bar-accent); }
.dial-wrap.min .dial.flow .dial-track { stroke: var(--bar-flow); }

.bar-wrap.compact { display: flex; align-items: flex-end; justify-content: flex-end; gap: 8px; }
.compact .bar {
  flex: 1; min-width: 0; width: auto;
  opacity: 0; transform: translateX(10px); visibility: hidden;
  transition: opacity 0.18s, transform 0.18s ease-out, visibility 0s 0.18s;
}
.compact.open .bar { opacity: 1; transform: none; visibility: visible; transition-delay: 0s; }
.compact .bar-main { min-height: 62px; }
.compact :is(.bar-time, .track) { display: none; }

/* ---------- mascot ----------
   Still by default: no looping animation, so it costs nothing while you work.
   It blinks now and then and only moves for events. */
.mascot {
  --m-fill: #5dbab0; --m-edge: rgb(0 0 0 / 0.25); --m-ink: #17201f; --m-leaf: #8fd18a;
  --m-cheek: rgb(243 154 138 / 0.55); --m-phones: #e3b24c;
  cursor: pointer;
}
.mascot svg { display: block; width: 100%; height: auto; overflow: visible; }
.m-body { transform-origin: 50% 100%; }
.m-sprout, .m-eyes { transform-box: fill-box; }
.m-sprout { transform-origin: 50% 100%; transition: transform 0.6s ease; }
.m-eyes { transform-origin: center; transition: transform 0.08s; }
.m-pupils { transition: transform 0.4s ease; }
.m-phones { opacity: 0; transform: translateY(-3px); transition: opacity 0.6s, transform 0.6s; }
.m-happy, .m-mouth-open { opacity: 0; }

/* base states */
.m-work .m-pupils, .m-flow .m-pupils { transform: translateY(1.6px); } /* eyes on the work */
.m-flow .m-phones { opacity: 1; transform: none; }
.m-flow .m-sprout { transform: rotate(-8deg); }
.m-idle .m-pupils { transform: none; }

/* moments */
.m-blink .m-eyes { transform: scaleY(0.1); }
.m-look .m-pupils { transform: translateY(-1.8px); }
.m-cheer .m-eyes, .m-finish .m-eyes, .m-cheer .m-mouth, .m-finish .m-mouth { opacity: 0; }
.m-cheer .m-happy, .m-finish .m-happy, .m-cheer .m-mouth-open, .m-finish .m-mouth-open { opacity: 1; }
.m-cheer .m-body, .m-cheer .m-paws { animation: m-hop 0.55s ease-out 2; }
.m-finish .m-body { animation: m-hop 0.6s ease-out 3; }
.m-inhale .m-body { transform: scale(1.08, 1.12); transition: transform 4s ease-in-out; }
.m-exhale .m-body { transform: none; transition: transform 6s ease-in-out; }
.m-inhale .m-eyes, .m-exhale .m-eyes { transform: scaleY(0.12); }

/* on the bar: the body hides behind it, the paws rest on its top edge */
.bar-wrap > .mascot { position: absolute; left: 22px; bottom: calc(100% - 8px); width: 56px; }
:is(.bar-wrap, .dial-wrap) > .mascot .m-body { position: relative; z-index: 0; }
:is(.bar-wrap, .dial-wrap) > .mascot .m-paws { position: absolute; left: 0; bottom: 3px; z-index: 2; }
/* on the minimal timer: same pose, a bit smaller, centered on the circle */
.dial-wrap > .mascot { position: absolute; left: 7px; bottom: calc(100% - 7px); width: 50px; }

/* in the box, after finishing a task */
.done-head { display: flex; align-items: center; gap: 14px; }
.done-head .mascot { width: 64px; flex: none; }

@keyframes m-hop {
  0% { transform: none; }
  25% { transform: translateY(2px) scale(1.08, 0.92); }
  55% { transform: translateY(-11px) scale(0.95, 1.06); }
  80% { transform: translateY(0) scale(1.04, 0.96); }
  100% { transform: none; }
}

/* ---------- entry box ---------- */
.entry-body { display: grid; place-items: center; padding: 24px; }
.entry-card {
  position: relative;
  width: 100%; max-height: 100%; overflow-y: auto;
  background: var(--surface); border-radius: 16px; padding: 24px;
  border: 1px solid var(--line);
  box-shadow: 0 16px 40px var(--shade);
  display: grid; gap: 12px;
}
.entry-card h1 {
  font-family: var(--f-display); font-weight: 700; font-size: 23px; line-height: 1.2;
  margin: 0; text-wrap: balance;
}
.entry-card h1 b { font-weight: 700; color: var(--accent); }
.entry-task { font-size: 13px; color: var(--muted); margin: 0; }
.entry-task b { color: var(--ink); }
.big { font-family: var(--f-display); font-size: 21px; font-weight: 700; line-height: 1.25; margin: 0; overflow-wrap: anywhere; }
.sub { margin: 0; font-size: 13.5px; color: var(--muted); }
.field {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--field);
  padding: 12px 14px; font-size: 18px;
}
.field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.field.sm { font-size: 15px; padding: 9px 12px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; justify-self: start; text-underline-offset: 3px; }
.linkbtn:hover { text-decoration: underline; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stack { display: grid; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: none; border-radius: 10px; padding: 8px 14px;
  transition: background-color 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s, transform 0.12s ease-out;
}
.btn:hover { border-color: var(--accent); background: var(--hover); }
.btn:active, .btn.pressed { transform: scale(0.97); background: var(--press); transition-duration: 0.06s; }
.btn:disabled { opacity: 0.35; pointer-events: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); box-shadow: 0 3px 12px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.primary:active, .btn.primary.pressed { background: color-mix(in srgb, var(--accent) 76%, var(--ink)); box-shadow: none; }
.btn.quiet { border-color: transparent; color: var(--muted); padding-inline: 6px; }
.btn.quiet:hover { color: var(--ink); background: var(--field); }
.btn.pick { width: 100%; text-align: left; justify-content: flex-start; }
.btn.pick:hover { padding-left: 18px; }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.icon { width: 30px; height: 30px; padding: 0; justify-content: center; font-size: 18px; line-height: 1; }
.btn .key { transition: opacity 0.15s; }
.btn:hover .key, .btn.pressed .key { opacity: 1; }
.key {
  font-family: var(--f-mono); font-size: 11px; line-height: 1;
  border: 1px solid currentColor; border-radius: 4px; padding: 2px 4px; opacity: 0.6;
}
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.count { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); margin-right: auto; }
.count.bump { animation: bump 0.35s; }
.shake { animation: shake 0.3s; }
.fly {
  position: absolute; left: 24px; pointer-events: none; font-size: 14px;
  background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px;
  white-space: nowrap; max-width: calc(100% - 48px); overflow: hidden; text-overflow: ellipsis;
  animation: fly 0.75s ease-in forwards;
}
.breath { display: grid; justify-items: center; gap: 10px; padding-block: 8px; }
.breath-ring { height: 150px; display: grid; place-items: center; }
.circle {
  width: 72px; height: 72px; border-radius: 50%;
  background: color-mix(in srgb, var(--accent) 18%, transparent); border: 2px solid var(--accent);
  transform: scale(1); transition-property: transform; transition-timing-function: ease-in-out;
}
.breath-label { font-family: var(--f-display); font-size: 20px; font-weight: 500; }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.items li { display: grid; gap: 4px; padding: 10px 12px; background: var(--field); border-radius: 10px; overflow-wrap: anywhere; }
.items .row { margin-top: 2px; }
.items .btn { padding: 4px 10px; font-size: 13px; }

/* ---------- overview window ---------- */
.home, .home body { height: auto; min-height: 100%; overflow: auto; background: var(--page); }
.home-body { padding: 0 28px 28px; }
.home-head {
  position: sticky; top: 0; z-index: 2; background: var(--page);
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  padding: 38px 0 16px; /* clears the macOS window buttons */
}
.home-head h1 { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1.15; margin: 0; }
.eyebrow { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.home-grid {
  display: grid; gap: 16px; align-items: start;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
  grid-template-areas: "now done" "plan done" "drawer done";
}
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px;
  display: grid; gap: 10px; align-content: start;
}
.panel h2 { font-family: var(--f-display); font-weight: 700; font-size: 17px; margin: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel-head .count { margin: 0; }
.opt { font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 4px; }
.now { grid-area: now; }
.done { grid-area: done; }
.plan { grid-area: plan; }
.drawer { grid-area: drawer; }
.now-title { font-family: var(--f-display); font-size: 21px; font-weight: 700; line-height: 1.25; margin: 0; overflow-wrap: anywhere; }
.now-title.muted { color: var(--muted); font-weight: 500; }
.now-step { margin: 0; overflow-wrap: anywhere; }
.now-step span { color: var(--muted); }
.now-time { margin: 0; font-family: var(--f-mono); font-size: 28px; font-variant-numeric: tabular-nums; color: var(--accent); }
.parked { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 4px; }
.parked-title { margin: 0 0 4px; font-weight: 700; overflow-wrap: anywhere; }
.daynav { display: flex; gap: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--field); border-radius: 10px; padding: 10px 12px; display: grid; }
.stat b { font-family: var(--f-display); font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.done-list, .plan-list, .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.done-list details { border-radius: 10px; transition: background-color 0.15s; }
.done-list details[open] { background: var(--field); padding-bottom: 10px; }
.done-list summary {
  display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: baseline;
  padding: 9px 10px; border-radius: 10px; cursor: pointer; list-style: none;
  transition: background-color 0.15s;
}
.done-list summary::-webkit-details-marker { display: none; }
.done-list summary:hover { background: var(--hover); }
.done-list .sub { padding: 0 10px 6px 64px; }
.at { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); width: 42px; }
.done-title { font-weight: 700; overflow-wrap: anywhere; }
.dur { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; font-weight: 700; color: var(--accent); border: 1px solid currentColor; border-radius: 5px; padding: 0 5px; margin-left: 4px; }
.steps { padding: 0 10px 0 64px; }
.steps li { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; padding: 3px 0; border-top: 1px dashed var(--line); }
.steps i { color: var(--muted); font-style: normal; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }
.plan-list li:not(.empty) {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 8px 8px 8px 12px; border-radius: 10px; background: var(--field);
  transition: background-color 0.15s, box-shadow 0.15s;
}
.plan-list li:not(.empty):hover { box-shadow: inset 0 0 0 1px var(--accent); }
.item-text { display: grid; min-width: 0; overflow-wrap: anywhere; }
.item-text .sub { font-size: 12px; }
.item-acts { display: flex; gap: 2px; flex: none; opacity: 0.55; transition: opacity 0.15s; }
.plan-list li:hover .item-acts, .item-acts:focus-within { opacity: 1; }
.drawer summary { cursor: pointer; list-style: none; border-radius: 8px; transition: color 0.15s; }
.drawer summary::-webkit-details-marker { display: none; }
.drawer summary:hover h2 { color: var(--accent); }
.drawer h2 .count { font-family: var(--f-body); font-weight: 400; margin-left: 6px; }
.drawer[open] summary { margin-bottom: 10px; }
@media (max-width: 720px) {
  .home-body { padding-inline: 16px; }
  .home-grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "now" "done" "plan" "drawer"; }
}

@keyframes swap { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes nudge { 50% { border-color: var(--bar-accent); } }
@keyframes fly { to { transform: translate(200px, 40px) scale(0.15); opacity: 0; } }
@keyframes ok {
  0% { background: var(--bar-accent); color: var(--bar-bg); transform: scale(0.9); }
