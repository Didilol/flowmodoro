# Smoke test on a clean Windows machine: installs the published installer, opens the app,
# types a task and a first step like a person would, restarts it and checks the task came back.
# Screenshots of each stage are saved as the "telas-windows" artifact.
name: Teste no Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release a testar (ex.: v0.2.0). Vazio: a mais recente."
        required: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Baixar o instalador da release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" --pattern "*-setup.exe" --dir installer
          ls -la installer

      - name: Instalar, abrir e usar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -TypeDefinition @'
          using System; using System.Text; using System.Collections.Generic; using System.Runtime.InteropServices;
          public static class W {
            delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] static extern void keybd_event(byte k, byte s, uint f, UIntPtr e);
            struct RECT { public int L, T, R, B; }
            public static string Title(IntPtr h) { var sb = new StringBuilder(256); GetWindowText(h, sb, 256); return sb.ToString(); }
            public static List<IntPtr> Of(HashSet<uint> pids) {
              var hs = new List<IntPtr>();
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p); if (pids.Contains(p)) hs.Add(h); return true; }, IntPtr.Zero);
              return hs;
            }
            public static string Describe(IntPtr h) {
              RECT r; GetWindowRect(h, out r);
              return string.Format("'{0}' visível={1} pos=({2},{3}) tam={4}x{5}", Title(h), IsWindowVisible(h), r.L, r.T, r.R - r.L, r.B - r.T);
            }
            // Windows only lets a process take the foreground right after input; a tap on Alt counts.
            public static bool Focus(IntPtr h) { keybd_event(0x12, 0, 0, UIntPtr.Zero); keybd_event(0x12, 0, 2, UIntPtr.Zero); return SetForegroundWindow(h); }
          }
          '@
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png")
          }
          function AppWindows() {
            $pids = [System.Collections.Generic.HashSet[uint32]]::new()
            Get-Process | Where-Object { $_.Path -like "$installDir*" -or $_.Name -like "msedgewebview2*" } | ForEach-Object { [void]$pids.Add([uint32]$_.Id) }
            [W]::Of($pids) | Where-Object { [W]::IsWindowVisible($_) }
          }
          function Report($label) {
            Write-Host "== $label"
            $pids = [System.Collections.Generic.HashSet[uint32]]::new()
            Get-Process | Where-Object { $_.Path -like "$installDir*" } | ForEach-Object { [void]$pids.Add([uint32]$_.Id) }
            [W]::Of($pids) | Where-Object { [W]::Title($_) -ne "" -or [W]::IsWindowVisible($_) } |
              ForEach-Object { Write-Host "   $([W]::Describe($_))" }
          }
          function BoxVisible() { [bool](AppWindows | Where-Object { [W]::Title($_) -eq "Focora" }) }

          $wv = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue
          Write-Host "WebView2: $(if ($wv) { $wv.pv } else { 'NÃO INSTALADO' })"
          Write-Host "Tela: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

          $setup = Get-ChildItem installer\*-setup.exe | Select-Object -First 1
          Write-Host "Instalando $($setup.Name)"
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $installDir = "$env:LOCALAPPDATA\Focora"
          $exe = Get-ChildItem $installDir -Filter *.exe | Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          if (-not $exe) { throw "app não encontrado em $installDir" }
          Write-Host "Instalado em $($exe.FullName)"

          # Clear the runner's console off the screen so the screenshots show the app.
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep 2

          # 1. First launch: the box should open asking what needs to be done.
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "o app fechou sozinho (código $($p.ExitCode))" }
          Shot "1-primeira-abertura"
          Report "Janelas na primeira abertura"
          $firstOpen = BoxVisible
          Write-Host "Caixa visível na primeira abertura: $firstOpen"
          if (-not $firstOpen) {
            # Call it like a user would: the global shortcut.
            [System.Windows.Forms.SendKeys]::SendWait("^ ")
            Start-Sleep 3
            Shot "1b-depois-do-atalho"
            Report "Janelas depois de Ctrl+Espaço"
            Write-Host "Caixa visível depois do atalho: $(BoxVisible)"
          }
          $box = AppWindows | Where-Object { [W]::Title($_) -eq "Focora" } | Select-Object -First 1
          if (-not $box) { throw "a caixa central (janela 'Focora') não apareceu nem pelo atalho" }

          # 2. Type a task and a first step into the box.
          Write-Host "Foco na caixa: $([W]::Focus($box))"
          Start-Sleep 1
          [System.Windows.Forms.SendKeys]::SendWait("Testar o Focora no Windows{ENTER}")
          Start-Sleep 2
          Shot "2-primeiro-passo"
          [System.Windows.Forms.SendKeys]::SendWait("Abrir o projeto{ENTER}")
          Start-Sleep 6
          Shot "3-barra-com-a-tarefa"
          Report "Janelas depois de começar a tarefa"
          if ($p.HasExited) { throw "o app fechou depois de começar a tarefa" }

          # 3. The data lives in %APPDATA% and the task is in it.
          Start-Sleep 16   # the app saves its state every 15 s
          $db = "$env:APPDATA\com.flowmodoro.app\flowmodoro.db"
          if (-not (Test-Path $db)) { throw "banco de dados não criado em $db" }
          $bytes = [System.IO.File]::ReadAllBytes($db)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          Write-Host "Banco de dados: $db ($($bytes.Length) bytes)"
          if ($text -notmatch "Testar o Focora no Windows") { throw "a tarefa digitada não foi salva (a digitação não chegou ao app)" }
          Write-Host "A tarefa digitada está salva no banco."

          # 4. Restart: the task should come back on the bar.
          Get-Process | Where-Object { $_.Path -like "$installDir*" } | Stop-Process -Force
          Start-Sleep 3
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep 15
          Shot "4-reaberto"
          if ($p.HasExited) { throw "o app não reabriu" }
          Report "Janelas depois de reabrir"
          Write-Host "OK: instalou, abriu, a caixa apareceu, a tarefa foi digitada, salva e voltou ao reabrir."

      - name: Guardar as telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas-windows
          path: shots/
